server:
  port: 8083
spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/lpc_user_db?useSSL=false&serverTimezone=UTC
    username: root
    password: toor
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # Options: none, validate, update, create, create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

## jwt expiration
application:
  security:
    jwt:
      secret-key: TFBDIFByb2plY3QgU2VjcmV0IEtleQ==
      access-token-expiration: 3600000       # 1 hour in ms
      refresh-token-expiration: 604800000    # 7 days in ms
